name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you manually re-trigger a deploy from the Actions tab without a new push.
  workflow_dispatch:

# Minimum permissions the deploy actually needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight one finish rather than
# cancelling it mid-deploy (unlike the CI workflow, which cancels stale runs).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build single-file game
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Builds the same self-contained, everything-inlined HTML file that
      # mathverse-single-file.html is — no separate assets, so there's no
      # GitHub Pages subpath/base-URL configuration to get wrong.
      - name: Build single-file bundle
        run: npm run build:single
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Package the build for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-single

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
